events {
    worker_connections 1024;
}

http {
    # 1. Ocultar la versión de Nginx por seguridad (Evita ataques dirigidos a versiones específicas)
    server_tokens off;

    # 2. Límite de subida de archivos (Alineado con los 5MB de Spring Boot + margen)
    client_max_body_size 20M;

    # ========================================================================
    # HARDENING: CABECERAS DE SEGURIDAD (Mitigación de alertas OWASP ZAP)
    # ========================================================================

    # Anti-clickjacking: Evita que tu sitio sea incrustado en un <iframe> malicioso
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME-Sniffing: Obliga al navegador a respetar los Content-Types declarados
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy: Protege la información de la URL al navegar a otros sitios
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: Bloquea el acceso a hardware del usuario (cámara, micro, GPS) que el hotel no usa
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Cross-Origin Policies: Aísla el proceso del navegador para evitar ataques tipo Spectre/Meltdown
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content Security Policy (CSP): Lista blanca estricta de dónde se pueden cargar scripts, estilos e imágenes
    # Nota: 'unsafe-inline' se permite temporalmente para que Tailwind y SvelteKit funcionen correctamente en SSR
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self' ws: wss: http: https:;" always;

    # ========================================================================
    # ENRUTAMIENTO (API GATEWAY)
    # ========================================================================

    server {
        listen 80;
        server_name localhost;

        # A. Enrutar la API al contenedor del Backend (Java en el puerto 8082)
        location /api/v1/ {
            proxy_pass http://backend:8082/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # B. Enrutar todo lo demás al contenedor del Frontend (SvelteKit en el puerto 3000)
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
