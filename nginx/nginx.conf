events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 20M;

    # ========================================================================
    # HARDENING Y CABECERAS DE SEGURIDAD (OWASP ZAP)
    # ========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https: http:; connect-src 'self' https: http: ws: wss:;" always;

    # 1. Servidor HTTP (Puerto 80) -> Redirige todo a HTTPS (443)
    server {
        listen 80;
        server_name 192.168.122.182 localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Servidor Seguro HTTPS (Puerto 443)
    server {
        listen 443 ssl;
        server_name 192.168.122.182 localhost;

        # Certificados SSL montados
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Protocolos TLS modernos (Seguridad)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # A. Enrutar la API al Backend (Java en puerto 8082)
        location /api/v1/ {
            proxy_pass http://backend:8082/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # B. Enrutar la UI al Frontend (SvelteKit en puerto 3000)
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
