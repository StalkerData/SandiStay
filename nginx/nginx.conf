events {
    worker_connections 1024;
}

http {
    # Ocultar la versión de Nginx por seguridad
    server_tokens off;
    client_max_body_size 20M; 

    server {
        listen 80;
        server_name localhost;

        # 1. Enrutar la API al contenedor del Backend (Java en el puerto 8082)
        location /api/v1/ {
            proxy_pass http://backend:8082/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Enrutar todo lo demás al contenedor del Frontend (SvelteKit en el puerto 3000)
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
