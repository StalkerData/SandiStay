# ==========================================
# Entorno de PRODUCCIÓN - SandiStay
# ==========================================
name: sandistay-prod

services:
  # 1. Base de Datos (Aislada)
  db:
    image: postgres:17-alpine
    container_name: prod_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sandi_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sandi_password123}
      POSTGRES_DB: ${DB_NAME:-sandistay_db}
      TZ: America/Bogota
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./SQL_Files:/docker-entrypoint-initdb.d/
    networks:
      - sandistay-prod-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # 2. Mock de Pagos (Aislado)
  payment_mock:
    build:
      context: ./payment_mock
      dockerfile: Dockerfile
    container_name: prod_payment_mock
    restart: always
    networks:
      - sandistay-prod-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 3. Backend Java (Aislado)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod_backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME:-sandistay_db}
      - DB_USER=${DB_USER:-sandi_admin}
      - DB_PASSWORD=${DB_PASSWORD:-sandi_password123}
      - PAYMENT_MOCK_URL=http://payment_mock:8000/api/v1/bank/statement/verify
      - JWT_SECRET=${JWT_SECRET:-U2FuZGlTdGF5U2VjcmV0S2V5UGFyYUZpcm1hRGVUb2tlbnMyMDI2IQ==}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # CRÍTICO: Configuración de la JVM según el Documento de Diseño
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1024m
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - payment_mock
    networks:
      - sandistay-prod-net
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # 4. Frontend SvelteKit (Aislado)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prod_frontend
    restart: always
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost/api/v1}
      - INTERNAL_API_HOST=http://backend:8082
      - BODY_SIZE_LIMIT=20M
      - NODE_ENV=production
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - backend
    networks:
      - sandistay-prod-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 5. API Gateway Nginx (El único expuesto a Internet)
  gateway:
    image: nginx:alpine
    container_name: prod_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sandistay-prod-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  sandistay-prod-net:
    driver: bridge
